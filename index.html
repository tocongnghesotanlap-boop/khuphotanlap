<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Khu phố Tân Lập</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#0B3D2E;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:420px;
}

.header{
  text-align:center;
  margin-bottom:30px;
}

.logo{
  width:180px;
  max-width:80%;
  border-radius:35px;
}

.title{
  color:#F4C430;
  font-size:34px;
  font-weight:700;
  margin-top:18px;
}

.subtitle{
  color:#fff;
  font-size:18px;
  margin-top:6px;
}

.card{
  background:white;
  border-radius:28px;
  padding:28px;
  box-shadow:
    0 12px 35px rgba(0,0,0,0.25);
}

.input{
  width:100%;
  padding:18px;
  border-radius:18px;
  border:2px solid #ddd;
  font-size:16px;
  margin-bottom:16px;
}

.input:focus{
  outline:none;
  border-color:#F4C430;
}

.btn{
  width:100%;
  border:none;
  background:#F4C430;
  color:#000;
  padding:18px;
  border-radius:20px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

.btn:hover{
  transform:scale(1.02);
}

.note{
  text-align:center;
  color:#777;
  margin-top:15px;
  font-size:14px;
}

.footer{
  text-align:center;
  color:white;
  margin-top:20px;
  font-size:14px;
}

@media(max-width:480px){

  .title{
    font-size:28px;
  }

  .logo{
    width:150px;
  }

}

</style>
</head>

<body>

<div class="container">

  <div class="header">

      <img
      src="logo.png"
      class="logo"
      alt="Logo">

      <div class="title">
          KHU PHỐ TÂN LẬP
      </div>

      <div class="subtitle">
          Quản lý địa bàn số
      </div>

  </div>

  <div class="card">

      <input
      id="username"
      class="input"
      placeholder="Tài khoản">

      <input
      id="password"
      class="input"
      type="password"
      placeholder="Mật khẩu">

      <button
      class="btn"
      onclick="login()">
          ĐĂNG NHẬP
      </button>

      <div class="note">
          Demo: admin / 123456
      </div>

  </div>

  <div class="footer">
      Ban điều hành Khu phố Tân Lập
  </div>

</div>

<script>

function login(){

  const user =
    document.getElementById(
      "username"
    ).value

  const pass =
    document.getElementById(
      "password"
    ).value

  if(
    user === "admin"
    &&
    pass === "123456"
  ){

    alert("Đăng nhập thành công 😎")

  }else{

    alert(
      "Sai tài khoản hoặc mật khẩu"
    )
  }
}

</script>

</body>
</html>
