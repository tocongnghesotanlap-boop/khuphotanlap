<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Khu phố Tân Lập</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0B3D2E;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
}

.logo-box{
    text-align:center;
    margin-bottom:30px;
}

.logo{
    width:150px;
    height:150px;
    object-fit:contain;
    border-radius:30px;
}

.title{
    color:#F4C430;
    font-size:34px;
    font-weight:bold;
    margin-top:18px;
}

.subtitle{
    color:white;
    margin-top:6px;
    font-size:18px;
}

.card{
    background:white;
    border-radius:30px;
    padding:30px;
    box-shadow:0 10px 35px rgba(0,0,0,0.2);
}

.input-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#0B3D2E;
}

input{
    width:100%;
    padding:16px;
    border-radius:16px;
    border:2px solid #ddd;
    font-size:16px;
}

input:focus{
    outline:none;
    border-color:#F4C430;
}

.btn{
    width:100%;
    background:#F4C430;
    border:none;
    padding:18px;
    border-radius:20px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin-top:12px;
}

.btn:hover{
    opacity:0.9;
}

.demo{
    text-align:center;
    margin-top:18px;
    color:#777;
    font-size:14px;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:white;
    font-size:14px;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo-box">

        <img
        src="https://i.imgur.com/4nQ0v6R.png"
        class="logo"
        >

        <div class="title">
            KHU PHỐ TÂN LẬP
        </div>

        <div class="subtitle">
            Quản lý địa bàn số
        </div>
    </div>

    <div class="card">

        <div class="input-group">
            <label>Tài khoản</label>

            <input
            type="text"
            id="username"
            placeholder="Nhập tài khoản">
        </div>

        <div class="input-group">
            <label>Mật khẩu</label>

            <input
            type="password"
            id="password"
            placeholder="Nhập mật khẩu">
        </div>

        <button
        class="btn"
        onclick="login()">
            ĐĂNG NHẬP
        </button>

        <div class="demo">
            Demo: admin / 123456
        </div>

    </div>

    <div class="footer">
        Ban điều hành Khu phố Tân Lập
    </div>

</div>

<script>

function login(){

    const user =
        document.getElementById(
            "username"
        ).value

    const pass =
        document.getElementById(
            "password"
        ).value

    if(
        user === "admin"
        &&
        pass === "123456"
    ){

        alert(
            "Đăng nhập thành công 😎"
        )

    }else{

        alert(
            "Sai tài khoản hoặc mật khẩu"
        )
    }
}

</script>

</body>
</html>
