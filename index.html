<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Khu phố Tân Lập - Quản lý địa bàn số</title>
  <style>
    /* --- HỆ THỐNG CỐT LÕI & RESET --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    body {
      background: #f5f5f5;
      color: #222;
      line-height: 1.5;
    }

    /* --- NÚT BACK CỐ ĐỊNH --- */
    #backBtn {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 9999;
      background: #0b5d46;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
      display: none;
      transition: background 0.2s;
    }
    #backBtn:hover {
      background: #0d7458;
    }

    /* --- TRANG ĐĂNG NHẬP --- */
    #loginPage {
      min-height: 100vh;
      background: #0B3D2E;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 420px;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo {
      width: 140px;
      border-radius: 24px;
    }
    .title {
      color: #F4C430;
      font-size: 32px;
      font-weight: bold;
      margin-top: 15px;
      letter-spacing: 0.5px;
    }
    .subtitle {
      color: rgba(255, 255, 255, 0.85);
      margin-top: 6px;
      font-size: 16px;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
    }
    .input {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: 2px solid #e0e0e0;
      font-size: 16px;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input:focus {
      border-color: #0B3D2E;
    }
    .btn {
      width: 100%;
      border: none;
      background: #F4C430;
      color: #000;
      padding: 16px;
      border-radius: 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }

    /* --- KHUNG TRANG PHÂN HỆ --- */
    .page {
      display: none;
      min-height: 100vh;
      padding-bottom: 100px;
    }
    .topbar {
      background: #0B3D2E;
      padding: 28px 24px;
      color: white;
      text-align: center;
    }
    .topbar h1 {
      color: #F4C430;
      font-size: 26px;
      font-weight: bold;
    }
    .topbar p {
      color: rgba(255,255,255,0.8);
      font-size: 14px;
      margin-top: 4px;
    }

    /* --- LƯỚI MENU & THẺ THÔNG TIN --- */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 20px;
    }
    .card-menu {
      background: white;
      border-radius: 20px;
      padding: 24px 16px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(0,0,0,.05);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card-menu:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,.08);
    }
    .icon {
      font-size: 38px;
      margin-bottom: 8px;
    }
    .name {
      font-weight: bold;
      color: #0B3D2E;
      font-size: 15px;
    }
