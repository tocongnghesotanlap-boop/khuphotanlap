<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Khu phố Tân Lập</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
    }

    #backBtn {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 9999;
      background: #0b5d46;
      color: #fff;
      border: none;
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
      display: none;
    }

    #backBtn:hover {
      background: #0d7458;
    }

    /* LOGIN PAGE */
    #loginPage {
      min-height: 100vh;
      background: #0B3D2E;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      width: 170px;
      border-radius: 30px;
    }

    .title {
      color: #F4C430;
      font-size: 34px;
      font-weight: bold;
      margin-top: 18px;
    }

    .subtitle {
      color: white;
      margin-top: 8px;
    }

    .card {
      background: white;
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
    }

    .input {
      width: 100%;
      padding: 18px;
      border-radius: 18px;
      border: 2px solid #ddd;
      font-size: 16px;
      margin-bottom: 16px;
    }

    .btn {
      width: 100%;
      border: none;
      background: #F4C430;
      color: #000;
      padding: 18px;
      border-radius: 18px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    /* GENERAL PAGE STRUCTURE */
    .page {
      display: none;
      min-height: 100vh;
      padding-bottom: 100px;
    }

    .topbar {
      background: #0B3D2E;
      padding: 24px;
      color: white;
    }

    .topbar h1 {
      color: #F4C430;
      font-size: 28px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 20px;
    }

    @media(max-width: 480px) {
      .grid {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 12px;
      }
    }

    .card-menu {
      background: white;
      border-radius: 24px;
      padding: 26px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(0,0,0,.08);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .card-menu:hover {
      transform: scale(1.02);
    }

    .icon {
      font-size: 40px;
    }

    .name {
      margin-top: 10px;
      font-weight: bold;
      color: #0B3D2E;
    }

    /* DETAILS & STATS */
    .detail-card {
      background: white;
      border-radius: 28px;
      padding: 24px;
      margin: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,.08);
    }

    .info-item {
      margin-bottom: 14px;
      font-size: 16px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 20px;
    }

    .stat-card {
      background: #fff;
      border-radius: 24px;
      padding: 26px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(0,0,0,.08);
    }

    .stat-card div {
      font-size: 16px;
      font-weight: bold;
      margin-top: 8px;
    }

    .stat-number {
      font-size: 34px;
      font-weight: bold;
      color: #0B3D2E;
      margin-top: 10px;
    }

    .big-card {
      background: #fff;
      margin: 20px;
      padding: 30px;
      border-radius: 24px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,.08);
    }

    .dangvien-card {
      background: #fff;
      border-radius: 24px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(0,0,0,.08);
      cursor: pointer;
    }

    .dangvien-avatar {
      width: 100px;
      height: 100px;
      background: #eee;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #0B3D2E;
      margin-bottom: 12px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 20px;
      width: 100%;
    }
