<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Khu phố Tân Lập</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#0B3D2E;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:420px;
}

.header{
  text-align:center;
  margin-bottom:25px;
}

.logo{
  font-size:90px;
}

.title{
  color:#F4C430;
  font-size:34px;
  font-weight:bold;
  margin-top:10px;
}

.subtitle{
  color:white;
  font-size:18px;
  margin-top:6px;
}

.card{
  background:white;
  border-radius:30px;
  padding:28px;
}

.input{
  width:100%;
  padding:18px;
  border-radius:18px;
  border:2px solid #ddd;
  font-size:16px;
  margin-bottom:18px;
}

.input:focus{
  outline:none;
  border-color:#F4C430;
}

.btn{
  width:100%;
  border:none;
  background:#F4C430;
  padding:18px;
  border-radius:20px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.note{
  text-align:center;
  color:#777;
  margin-top:14px;
}

</style>
</head>

<body>

<div class="container">

  <div class="header">
      <img
src="logo.png"
class="logo"
>

      <div class="title">
          KHU PHỐ TÂN LẬP
      </div>

      <div class="subtitle">
          Quản lý địa bàn số
      </div>
  </div>

  <div class="card">

      <input
      id="username"
      class="input"
      placeholder="Tài khoản">

      <input
      id="password"
      class="input"
      type="password"
      placeholder="Mật khẩu">

      <button
      class="btn"
      onclick="login()">
          ĐĂNG NHẬP
      </button>

      <div class="note">
          Demo: admin / 123456
      </div>

  </div>

</div>

<script>

function login(){

  const user =
    document.getElementById(
      "username"
    ).value

  const pass =
    document.getElementById(
      "password"
    ).value

  if(
    user === "admin"
    &&
    pass === "123456"
  ){

    alert(
      "Đăng nhập thành công 😎"
    )

  }else{

    alert(
      "Sai tài khoản hoặc mật khẩu"
    )
  }
}

</script>

</body>
</html>
