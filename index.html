<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Khu phố Tân Lập</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#0B3D2E;
  min-height:100vh;
}

/* LOGIN */

#loginPage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:420px;
}

.header{
  text-align:center;
  margin-bottom:30px;
}

.logo{
  width:180px;
  border-radius:35px;
}

.title{
  color:#F4C430;
  font-size:34px;
  font-weight:bold;
  margin-top:18px;
}

.subtitle{
  color:white;
  margin-top:6px;
}

.card{
  background:white;
  border-radius:28px;
  padding:28px;
}

.input{
  width:100%;
  padding:18px;
  border-radius:18px;
  border:2px solid #ddd;
  font-size:16px;
  margin-bottom:16px;
}

.btn{
  width:100%;
  border:none;
  background:#F4C430;
  color:black;
  padding:18px;
  border-radius:20px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

/* HOME */

#homePage{
  display:none;
  min-height:100vh;
  background:#f5f5f5;
}

.topbar{
  background:#0B3D2E;
  padding:22px;
  color:white;
}

.topbar h1{
  color:#F4C430;
  font-size:28px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  padding:20px;
}

.card-menu{
  background:white;
  border-radius:24px;
  padding:28px;
  text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,.08);
}

.icon{
  font-size:42px;
}

.name{
  margin-top:10px;
  font-weight:bold;
  color:#0B3D2E;
}

.footer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:14px;
  box-shadow:0 -2px 15px rgba(0,0,0,.1);
}

.footer-item{
  text-align:center;
  font-size:13px;
}

.footer-item div:first-child{
  font-size:22px;
}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

<div class="container">

<div class="header">

<img
src="logo.png"
class="logo">

<div class="title">
KHU PHỐ TÂN LẬP
</div>

<div class="subtitle">
Quản lý địa bàn số
</div>

</div>

<div class="card">

<input
id="username"
class="input"
placeholder="Tài khoản">

<input
id="password"
class="input"
type="password"
placeholder="Mật khẩu">

<button
class="btn"
onclick="login()">

ĐĂNG NHẬP

</button>

</div>

</div>

</div>

<!-- HOME -->

<div id="homePage">

<div class="topbar">

<h1>KHU PHỐ TÂN LẬP</h1>

<p>Quản lý địa bàn số</p>

</div>

<div class="grid">

<div class="card-menu">
<div class="icon">📊</div>
<div class="name">Tổng quan</div>
</div>

<div class="card-menu">
<div class="icon">🏘️</div>
<div class="name">Tổ NDTQ</div>
</div>

<div class="card-menu">
<div class="icon">👥</div>
<div class="name">Nhân khẩu</div>
</div>

<div class="card-menu">
<div class="icon">🏪</div>
<div class="name">Hộ kinh doanh</div>
</div>

<div class="card-menu">
<div class="icon">🧑‍💼</div>
<div class="name">Đảng viên</div>
</div>

<div class="card-menu">
<div class="icon">⚠️</div>
<div class="name">Đối tượng</div>
</div>

</div>

<div class="footer">

<div class="footer-item">
<div>🔍</div>
<div>Tìm kiếm</div>
</div>

<div class="footer-item">
<div>📈</div>
<div>Thống kê</div>
</div>

<div class="footer-item">
<div>📄</div>
<div>Báo cáo</div>
</div>

<div class="footer-item">
<div>👤</div>
<div>Tài khoản</div>
</div>

</div>

</div>

<script>

function login(){

const user =
document.getElementById(
"username"
).value

const pass =
document.getElementById(
"password"
).value

if(
user === "admin"
&&
pass === "123456"
){

document.getElementById(
"loginPage"
).style.display = "none"

document.getElementById(
"homePage"
).style.display = "block"

}else{

alert(
"Sai tài khoản hoặc mật khẩu"
)

}

}

</script>

</body>
</html>
