<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Khu phố Tân Lập</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#0B3D2E;
  min-height:100vh;
}

/* LOGIN */

#loginPage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:420px;
}

.header{
  text-align:center;
  margin-bottom:30px;
}

.logo{
  width:180px;
  border-radius:35px;
}

.title{
  color:#F4C430;
  font-size:34px;
  font-weight:bold;
  margin-top:18px;
}

.subtitle{
  color:white;
  margin-top:6px;
}

.card{
  background:white;
  border-radius:28px;
  padding:28px;
  box-shadow:0 6px 20px rgba(0,0,0,.08);
}

.input{
  width:100%;
  padding:18px;
  border-radius:18px;
  border:2px solid #ddd;
  font-size:16px;
  margin-bottom:16px;
}

.btn{
  width:100%;
  border:none;
  background:#F4C430;
  color:black;
  padding:18px;
  border-radius:20px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

/* HOME */

#homePage,
#toPage,
#detailPage{
  display:none;
  min-height:100vh;
  background:#f5f5f5;
}

.topbar{
  background:#0B3D2E;
  padding:22px;
  color:white;
}

.topbar h1{
  color:#F4C430;
  font-size:28px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  padding:20px;
}

.card-menu{
  background:white;
  border-radius:24px;
  padding:28px;
  text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,.08);
  cursor:pointer;
}

.icon{
  font-size:42px;
}

.name{
  margin-top:10px;
  font-weight:bold;
  color:#0B3D2E;
}

.footer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:14px;
  box-shadow:0 -2px 15px rgba(0,0,0,.1);
}

.footer-item{
  text-align:center;
  font-size:13px;
}

.footer-item div:first-child{
  font-size:22px;
}

.back-btn{
  background:#F4C430;
  border:none;
  padding:12px 20px;
  border-radius:12px;
  font-weight:bold;
  margin-bottom:15px;
  cursor:pointer;
}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

<div class="container">

<div class="header">

<img src="logo.png" class="logo">

<div class="title">
KHU PHỐ TÂN LẬP
</div>

<div class="subtitle">
Quản lý địa bàn số
</div>

</div>

<div class="card">

<input
id="username"
class="input"
placeholder="Tài khoản">

<input
id="password"
class="input"
type="password"
placeholder="Mật khẩu">

<button
class="btn"
onclick="login()">

ĐĂNG NHẬP

</button>

</div>

</div>

</div>

<!-- HOME -->

<div id="homePage">

<div class="topbar">

<h1>KHU PHỐ TÂN LẬP</h1>

<p>Quản lý địa bàn số</p>

</div>

<div class="grid">

<div class="card-menu">
<div class="icon">📊</div>
<div class="name">Tổng quan</div>
</div>

<div
class="card-menu"
onclick="openToNDTQ()">

<div class="icon">🏘️</div>

<div class="name">
Tổ NDTQ
</div>

</div>

<div class="card-menu">
<div class="icon">👥</div>
<div class="name">Nhân khẩu</div>
</div>

<div class="card-menu">
<div class="icon">🏪</div>
<div class="name">Hộ kinh doanh</div>
</div>

<div class="card-menu">
<div class="icon">🧑‍💼</div>
<div class="name">Đảng viên</div>
</div>

<div class="card-menu">
<div class="icon">⚠️</div>
<div class="name">Đối tượng</div>
</div>

</div>

</div>

<!-- TO NDTQ -->

<div id="toPage">

<div class="topbar">
<h1>TỔ NDTQ</h1>
<p>Quản lý tổ nhân dân tự quản</p>
</div>

<div id="toContainer" class="grid"></div>

</div>

<!-- DETAIL -->

<div id="detailPage">

<div class="topbar">

<h1 id="tenTo"></h1>

<p>Thông tin tổ</p>

</div>

<div style="padding:20px;">

<button
class="back-btn"
onclick="backToTo()">

← Quay lại

</button>

<div class="card">

<p><b>Diện tích:</b>
<span id="dienTich"></span>
</p>

<br>

<p><b>Số hộ:</b>
<span id="soHo"></span>
</p>

<br>

<h3>Tổ trưởng</h3>

<p id="toTruong"></p>

<p>
📞
<span id="sdtTruong"></span>
</p>

<br>

<h3>Tổ phó</h3>

<p id="toPho"></p>

<p>
📞
<span id="sdtPho"></span>
</p>

</div>

</div>

</div>

<script>

document.getElementById(
"loginPage"
).style.display = "flex"

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRUglpiQKTQ-LQ6DXE_syygvGf1SHibDS-EhnJKx_UGQ7NwABXrorPEe630bnCuSdp7UQjjaukm3nuy/pub?gid=0&single=true&output=csv"

let dsTo = []

function login(){

const user =
document.getElementById(
"username"
).value

const pass =
document.getElementById(
"password"
).value

if(
user === "admin"
&&
pass === "123456"
){

document.getElementById(
"loginPage"
).style.display =
"none"

document.getElementById(
"homePage"
).style.display =
"block"

}else{

alert(
"Sai tài khoản hoặc mật khẩu"
)

}

}

async function openToNDTQ(){

document.getElementById(
"homePage"
).style.display =
"none"

document.getElementById(
"toPage"
).style.display =
"block"

if(dsTo.length > 0){
return
}

const res =
await fetch(csvUrl)

const csv =
await res.text()

const rows =
csv.split("\n").slice(1)

rows.forEach(row=>{

const cols =
row.split(",")

if(cols.length < 8)return

dsTo.push({

tenTo:
cols[1]?.trim(),

dienTich:
cols[2]?.trim(),

soHo:
cols[3]?.trim(),

toTruong:
cols[4]?.trim(),

sdtToTruong:
cols[5]?.trim(),

toPho:
cols[7]?.trim(),

sdtToPho:
cols[8]?.trim()

})

})

renderTo()

}

function renderTo(){

const container =
document.getElementById(
"toContainer"
)

container.innerHTML = ""

dsTo.forEach(to=>{

container.innerHTML += `

<div
class="card-menu"
onclick='openToDetail(
${JSON.stringify(to)}
)'>

<div class="icon">
🏘️
</div>

<div class="name">
${to.tenTo}
</div>

</div>

`

})

}

function openToDetail(to){

document.getElementById(
"toPage"
).style.display =
"none"

document.getElementById(
"detailPage"
).style.display =
"block"

document.getElementById(
"tenTo"
).innerText =
to.tenTo

document.getElementById(
"dienTich"
).innerText =
to.dienTich

document.getElementById(
"soHo"
).innerText =
to.soHo

document.getElementById(
"toTruong"
).innerText =
to.toTruong

document.getElementById(
"sdtTruong"
).innerText =
to.sdtToTruong

document.getElementById(
"toPho"
).innerText =
to.toPho

document.getElementById(
"sdtPho"
).innerText =
to.sdtToPho

}

function backToTo(){

document.getElementById(
"detailPage"
).style.display =
"none"

document.getElementById(
"toPage"
).style.display =
"block"

}

</script>

</body>
</html>
